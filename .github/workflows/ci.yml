name: AudioHub CI Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]

jobs:
  build-frontend:
    name: Build Frontend (React)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '20'
        cache: 'npm'
        cache-dependency-path: frontend/package-lock.json
        
    - name: Install Dependencies
      working-directory: ./frontend
      run: npm ci
      
    - name: Build Frontend
      working-directory: ./frontend
      run: npm run build

  build-backend:
    name: Build Backend (Spring Boot)
    runs-on: ubuntu-latest
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'
        cache: maven
        
    - name: Build common-events (Shared Library)
      working-directory: ./backend/common-events
      run: mvn clean install -DskipTests
      
    - name: Build API Gateway
      working-directory: ./backend/api-gateway
      run: mvn clean package -DskipTests
      
    - name: Build Auth Service
      working-directory: ./backend/auth-service
      run: mvn clean package -DskipTests
      
    - name: Build Product Service
      working-directory: ./backend/product-service
      run: mvn clean package -DskipTests
      
    - name: Build Inventory Service
      working-directory: ./backend/inventory-service
      run: mvn clean package -DskipTests
      
    - name: Build Order Service
      working-directory: ./backend/order-service
      run: mvn clean package -DskipTests
      
    - name: Build Payment Service
      working-directory: ./backend/payment-service
      run: mvn clean package -DskipTests
      
    - name: Build Notification Service
      working-directory: ./backend/notification-service
      run: mvn clean package -DskipTests

  docker-compose-test:
    name: Test Docker Compose Build
    runs-on: ubuntu-latest
    needs: [build-frontend, build-backend]
    
    steps:
    - uses: actions/checkout@v4
    
    - name: Build all Docker images
      run: docker-compose build
