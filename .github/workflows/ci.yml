name: CI — Build & Test All Microservices

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]

jobs:
  build-common-events:
    name: Build common-events library
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      - name: Install common-events to local Maven cache
        run: mvn clean install -DskipTests
        working-directory: backend/common-events

  build-services:
    name: Build ${{ matrix.service }}
    runs-on: ubuntu-latest
    needs: build-common-events
    strategy:
      matrix:
        service:
          - discovery-server
          - api-gateway
          - auth-service
          - product-service
          - order-service
          - inventory-service
          - payment-service
          - notification-service
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven
      # Restore common-events from cache
      - name: Install common-events
        run: mvn clean install -DskipTests
        working-directory: backend/common-events
      - name: Build ${{ matrix.service }}
        run: mvn clean package -DskipTests
        working-directory: backend/${{ matrix.service }}
      - name: Upload JAR artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.service }}-jar
          path: backend/${{ matrix.service }}/target/*.jar
          retention-days: 1

  build-frontend:
    name: Build React Frontend
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install dependencies
        run: npm ci
        working-directory: frontend
      - name: Build
        run: npm run build
        working-directory: frontend
        env:
          VITE_API_URL: https://your-ec2-ip-or-domain
