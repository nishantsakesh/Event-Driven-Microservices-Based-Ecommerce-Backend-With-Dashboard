spring.application.name=api-gateway
server.port=8888

# ─── Eureka Registration ───────────────────────────────────────────
eureka.client.service-url.defaultZone=${EUREKA_URI:http://localhost:8761/eureka/}
eureka.instance.prefer-ip-address=true
eureka.client.http-client.type=resttemplate

# ─── Spring Cloud MVC Gateway Routes ───────────────────────────────
spring.cloud.gateway.mvc.routes[0].id=auth-service
spring.cloud.gateway.mvc.routes[0].uri=${AUTH_SERVICE_URL:lb://auth-service}
spring.cloud.gateway.mvc.routes[0].predicates[0]=Path=/api/auth/**

spring.cloud.gateway.mvc.routes[1].id=product-service
spring.cloud.gateway.mvc.routes[1].uri=${PRODUCT_SERVICE_URL:lb://product-service}
spring.cloud.gateway.mvc.routes[1].predicates[0]=Path=/api/products/**

spring.cloud.gateway.mvc.routes[2].id=inventory-service
spring.cloud.gateway.mvc.routes[2].uri=${INVENTORY_SERVICE_URL:lb://inventory-service}
spring.cloud.gateway.mvc.routes[2].predicates[0]=Path=/api/inventory/**

spring.cloud.gateway.mvc.routes[3].id=order-service
spring.cloud.gateway.mvc.routes[3].uri=${ORDER_SERVICE_URL:lb://order-service}
spring.cloud.gateway.mvc.routes[3].predicates[0]=Path=/api/orders/**

spring.cloud.gateway.mvc.routes[4].id=payment-service
spring.cloud.gateway.mvc.routes[4].uri=${PAYMENT_SERVICE_URL:lb://payment-service}
spring.cloud.gateway.mvc.routes[4].predicates[0]=Path=/api/payments/**

spring.cloud.gateway.mvc.routes[5].id=notification-service
spring.cloud.gateway.mvc.routes[5].uri=${NOTIFICATION_SERVICE_URL:lb://notification-service}
spring.cloud.gateway.mvc.routes[5].predicates[0]=Path=/api/notifications/**

spring.cloud.gateway.mvc.routes[6].id=category-route
spring.cloud.gateway.mvc.routes[6].uri=${PRODUCT_SERVICE_URL:lb://product-service}
spring.cloud.gateway.mvc.routes[6].predicates[0]=Path=/api/categories/**

# ─── Redis for rate limiting ───────────────────────────────────────
spring.data.redis.host=${REDIS_HOST:localhost}
spring.data.redis.port=${REDIS_PORT:6379}

# ─── Memory & Thread Pool Optimization ─────────────────────────────
server.tomcat.threads.max=50
server.tomcat.threads.min-spare=10

# ─── Logging ──────────────────────────────────────────────────────
logging.level.com.ecommerce.api_gateway=INFO
